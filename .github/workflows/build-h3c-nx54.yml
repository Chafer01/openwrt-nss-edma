#
# Single-board build for the H3C Magic NX54 (IPQ5018 + QCA8337 + QCN9074, 512 MB).
#
# Unlike build-ipq50xx.yml this builds one device, keeps the initramfs and factory.ubi
# that a first install from stock U-Boot needs, adds LuCI, and leaves the result as a
# workflow artifact instead of a release - nothing is published.
#
# Run it from the Actions tab of your fork: "Build H3C NX54 (NSS)" -> Run workflow.
#
name: Build H3C NX54 (NSS)

on:
  push:
    branches: [h3c-nx54]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      nss_firmware:
        description: "NSS firmware line"
        type: choice
        options: ["12_5", "12_2"]
        default: "12_5"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      TARGET: qualcommax/ipq50xx
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync \
            python3-setuptools swig unzip file wget

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds list -r nss | grep -q qca-nss-drv

      - name: Assemble .config
        run: |
          set -euo pipefail
          cat >.config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_h3c_nx54=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          # memory profiles of the "std" (512 MB) group
          CONFIG_ATH11K_MEM_PROFILE_1G=y
          CONFIG_NSS_MEM_PROFILE_MEDIUM=y

          # NSS wired plane + ECM (must be =y, not =m - see README.ipq50xx.md)
          CONFIG_PACKAGE_nss-tools-dwmac=y
          CONFIG_PACKAGE_nss-firmware=y
          CONFIG_NSS_FIRMWARE_VERSION_${{ inputs.nss_firmware || '12_5' }}=y
          CONFIG_NSS_DRV_VLAN_ENABLE=y
          CONFIG_NSS_DRV_IPV6_ENABLE=y
          CONFIG_NSS_DRV_VIRT_IF_ENABLE=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-netlink=y
          CONFIG_PACKAGE_nssinfo=y

          # Wi-Fi on the NSS path
          CONFIG_PACKAGE_MAC80211_NSS_SUPPORT=y
          CONFIG_ATH11K_NSS_SUPPORT=y
          CONFIG_ATH11K_NSS_MESH_SUPPORT=y
          CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE=y
          CONFIG_NSS_DRV_WIFI_EXT_VDEV_ENABLE=y

          # SQM in the NSS firmware (shipped disabled)
          CONFIG_NSS_DRV_SHAPER_ENABLE=y
          CONFIG_NSS_DRV_IGS_ENABLE=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-igs=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_sqm-scripts-nss=y
          CONFIG_PACKAGE_tc-full=y

          # web UI and diagnostics
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-nss=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_dumpimage=y

          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          # CONFIG_KERNEL_DEBUG_INFO is not set
          EOF
          sed -i 's/^ *//' .config
          make defconfig
          missing=0
          for s in DEVICE_h3c_nx54 PACKAGE_nss-tools-dwmac PACKAGE_ath11k-firmware-ipq5018-qcn6122 \
                   PACKAGE_ipq-wifi-h3c_nx54 ATH11K_NSS_SUPPORT TARGET_ROOTFS_INITRAMFS; do
            grep -q "^CONFIG_.*${s}=y" .config || { echo "::error::${s} not selected"; missing=1; }
          done
          grep -q '^CONFIG_PACKAGE_ath11k-firmware-ipq5018=y' .config && \
            { echo "::error::single-PD ath11k-firmware-ipq5018 selected; the DTS needs the multi-PD image"; missing=1; }
          exit $missing

      - name: Download sources
        timeout-minutes: 75
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=60 20m make download -j"$(nproc)" && exit 0
            sleep 5
          done
          exit 1

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-h3c-nx54-${{ github.run_id }}
          restore-keys: ccache-h3c-nx54-

      - name: Build
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          if ! make -j"$(nproc)"; then
            make -j1 V=s 2>&1 | tail -300
            exit 1
          fi

      - name: Check the output
        run: |
          set -euo pipefail
          out="bin/targets/${TARGET}"
          ls -la "$out"
          for f in initramfs-uImage.itb squashfs-factory.ubi squashfs-sysupgrade.bin; do
            compgen -G "$out/openwrt-*h3c_nx54-${f}" >/dev/null || { echo "::error::missing ${f}"; exit 1; }
          done
          # the NSS arming service must be in the image, ath11k must not autoload, and the
          # board table must know the NX54
          root=$(ls -d build_dir/target-*/root-qualcommax* 2>/dev/null | head -1)
          [ -n "$root" ] || { echo "::error::rootfs staging dir not found"; exit 1; }
          test -e "$root/etc/init.d/nss" || { echo "::error::/etc/init.d/nss not in the image"; exit 1; }
          if ls "$root"/etc/modules.d/ath11k* >/dev/null 2>&1; then
            echo "::error::ath11k autoloads; run make package/kernel/mac80211/clean"; exit 1
          fi
          grep -q 'h3c,nx54' "$root/etc/uci-defaults/99-nss-topology" \
            || { echo "::error::NX54 missing from the NSS board table"; exit 1; }
          echo "image checks passed"

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-h3c_nx54-nss-${{ github.run_number }}
          path: |
            bin/targets/${{ env.TARGET }}/openwrt-*h3c_nx54-*
            bin/targets/${{ env.TARGET }}/sha256sums
            bin/targets/${{ env.TARGET }}/*.buildinfo
          retention-days: 30
